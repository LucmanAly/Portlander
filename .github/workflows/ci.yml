name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Build first: it runs `tsc -b`, so a type error fails here rather than
      # surfacing as a confusing test failure later.
      - run: npm run build

      - run: npm run lint

      - run: npm test
